name: mafia-camp-game
native_deps:
  head_html: |-
    <!-- Prepsto feedback panel: the footer's Suggest an idea link (data-prepsto-open) opens it -->
    <script src="https://prepsto.com/_/theme/widget.js" data-prepsto="8ta2479" data-button="false" data-label="Suggest an idea" async></script>
    <script src="_/theme/legal-kit.js?v=26d7577aee"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#0d1530">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link id="mc-favicon" rel="icon" type="image/svg+xml" href="_/theme/favicon.svg?v=1">
    <link rel="apple-touch-icon" href="_/theme/apple-touch-icon.png?v=1">
    <link rel="stylesheet" href="_/theme/mafia.css?v=1">
    <script src="_/theme/peerjs.min.js?v=1.5.2"></script>
    <script src="_/theme/mafia.js?v=1"></script>
    <script>
    /* Keep our tab icon: Anvil adds its own <link rel="icon">, so drop any other icon link. */
    (function () {
      function keep() {
        var ours = document.getElementById('mc-favicon');
        if (!ours) return;
        document.querySelectorAll('link[rel~="icon"]').forEach(function (l) { if (l !== ours) l.remove(); });
      }
      keep();
      document.addEventListener('DOMContentLoaded', keep);
      window.addEventListener('load', keep);
    })();
    </script>
    <style>html, body { background: #0d1530; margin: 0; }</style>
package_name: mafia_camp_game
runtime_options:
  client_version: '3'
  server_spec: {}
  server_version: python3-full
  version: 2
services:
- client_config: {}
  server_config: {}
  source: /runtime/services/tables.yml
- client_config: {allow_remember_me: true, allow_signup: true, confirm_email: false, enable_automatically: true, remember_me_days: 365, require_secure_passwords: false, share_login_status: true, use_email: true, use_google: true}
  server_config: {user_table: users}
  source: /runtime/services/anvil/users.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/google.yml
startup: {module: Form1, type: form}
startup_form: null
metadata:
  description: A video party game for up to 10 friends. Roles, secrets, a campfire and one question - who is the Mafia?
  logo_img: asset:logo.png
  title: Mafia Camp
