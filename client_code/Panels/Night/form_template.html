<div class="p-night">
  <div anvil:name="job">
    <anvil-component type="Label" name="title" prop:role='["p-title"]'></anvil-component>
    <anvil-component type="Label" name="sub" prop:role='["p-sub"]'></anvil-component>
    <anvil-component type="Label" name="note" prop:role='["note"]'></anvil-component>
  </div>
  <div class="sleep" anvil:name="sleep">
    <div class="zz" aria-hidden="true"><span>z</span><span>z</span><span>Z</span></div>
    <anvil-component type="Label" name="sleep_title" prop:role='["p-title"]'></anvil-component>
    <anvil-component type="Label" name="sleep_sub" prop:role='["p-sub"]'></anvil-component>
  </div>
  <anvil-component type="mafia_camp_game.Components.Notebook" name="notebook"></anvil-component>
</div>
